<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Initiatievenkaart Noord-Nederland</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQvIf8iR4X0ra+g9nKxQp0sEpe2j4A="
      crossorigin=""
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="layout">
      <section class="panel" aria-label="Kaartfilters">
        <div class="controls" aria-label="Kaartfilters">
          <label>
            Provincie
            <select id="province-filter">
              <option value="all">Alle provincies</option>
            </select>
          </label>
          <label>
            Thema
            <select id="theme-filter">
              <option value="all">Alle thema's</option>
            </select>
          </label>
        </div>

        <div id="theme-legend" class="legend" aria-label="Themakleuren"></div>
      </section>

      <section class="map-shell" aria-label="Interactieve kaart">
        <div id="map"></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
